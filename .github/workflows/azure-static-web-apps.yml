name: Deploy to Azure Static Web Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy_preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Deploy pull request preview
    environment: DEV
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install validation tools
        run: npm ci

      - name: Validate and build static website
        run: npm run ci

      - name: Add preview deployment metadata
        env:
          DEPLOYMENT_COMMIT: ${{ github.sha }}
          DEPLOYMENT_TYPE: preview
        run: node scripts/write-deployment-info.mjs

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close preview environment
    environment: DEV
    steps:
      - name: Close preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close

  deploy_production:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Deploy production
    environment: PROD
    concurrency:
      group: azure-static-web-apps-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install validation tools
        run: npm ci

      - name: Validate and build static website
        run: npm run ci

      - name: Set two-hour RUM cutoff
        shell: bash
        run: echo "RUM_CUTOFF_UTC=$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Build privacy-safe production telemetry
        env:
          RUM_REQUIRED: "true"
          RUM_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
        run: npm run build

      - name: Add production deployment metadata
        env:
          DEPLOYMENT_COMMIT: ${{ github.sha }}
          DEPLOYMENT_TYPE: production
        run: node scripts/write-deployment-info.mjs

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: ""
          output_location: ""
          skip_app_build: true
